# Kali Linux Universal Forwarder - $SPLUNK_HOME/etc/system/local/inputs.conf
[monitor:///var/log/syslog]
index = linux
sourcetype = syslog

[monitor:///var/log/apache2/access.log]
index = linux
sourcetype = access_combined

[monitor:///var/log/apache2/error.log]
index = linux
sourcetype = apache_error

# SSH / sudo events (needs rsyslog so /var/log/auth.log exists)
