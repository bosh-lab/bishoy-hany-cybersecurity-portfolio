# Windows Universal Forwarder - $SPLUNK_HOME\etc\system\local\inputs.conf
# Sysmon is installed separately (Sysinternals Sysmon + a community config).
[WinEventLog://Security]
index = windows
disabled = false

[WinEventLog://System]
index = windows
disabled = false

[WinEventLog://Application]
index = windows
disabled = false

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
index = windows
disabled = false
renderXml = true
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
